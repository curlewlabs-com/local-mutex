name: "Local Mutex"
description: >-
  Serialize shared resources across self-hosted runners on the same machine. Kernel-level lockf/flock.
author: "curlewlabs-com"
branding:
  icon: "lock"
  color: "blue"

inputs:
  name:
    description: >-
      Lock identifier. Echoed verbatim into the diagnostic ::notice::
      annotations and hashed with SHA-256 to form the lock file
      basename under /tmp (as 'local-mutex-<64-hex-digest>.lock').
      Pick a name that describes the resource being protected
      (e.g. 'tool-update', 'dep-cache-rebuild', 'db-migrate'). Any
      length and byte sequence is accepted; empty, whitespace-only,
      and control-character-containing (newline, tab, etc.) values
      are rejected.
    required: true
  run:
    description: >-
      Shell command to execute while holding the lock. Runs under /bin/sh.
      Multi-line scripts are supported. Use `set -e` if you want abort-on-
      first-failure semantics - the wrapper does not impose them. Empty or
      whitespace-only values are rejected.
    required: true
  lock-dir:
    description: >-
      Absolute path to the directory where the lock file is created.
      Defaults to /tmp. Override this only when /tmp is not shared
      across the runners on the same machine - for example, on
      containerized self-hosted runners where /tmp is container-local.
      The directory must exist and be writable by the runner user. The
      lock file basename inside this directory is the SHA-256 of name
      (as 'local-mutex-<64-hex-digest>.lock'), so callers setting the
      same name from two runners continue to serialize as long as
      they share lock-dir and one kernel. A directory a VM-hosted
      container shares with native host processes crosses a kernel
      boundary, across which this action promises nothing; see
      README.md.
    required: false
    default: ""

outputs:
  output-file:
    description: >-
      Path to a file containing all GITHUB_OUTPUT writes made by the inner
      command. Callers that need to propagate outputs across the composite
      action boundary can cat this file into their own GITHUB_OUTPUT in a
      subsequent step. See README.md for the pattern.
    value: ${{ steps.run.outputs.output-file }}

runs:
  using: "composite"
  steps:
    - name: Run under local mutex
      id: run
      shell: sh
      env:
        INPUT_NAME: ${{ inputs.name }}
        INPUT_RUN: ${{ inputs.run }}
        INPUT_LOCK_DIR: ${{ inputs.lock-dir }}
      run: '"$GITHUB_ACTION_PATH/lib/run-step.sh"'
